name: Release

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          # repository_owner (shaneshaguruge) is already lowercase, as GHCR requires
          tags: |
            ghcr.io/${{ github.repository_owner }}/leaveflow-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/leaveflow-api:main
