name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Lint server
        run: npm ci && npm run lint
        working-directory: server
      - name: Lint client
        run: npm ci && npm run lint
        working-directory: client

  test-api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaveflow
          POSTGRES_PASSWORD: leaveflow
          POSTGRES_DB: leaveflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaveflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://leaveflow:leaveflow@localhost:5432/leaveflow_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run migrate
        working-directory: server
      - run: npm test
        working-directory: server

  test-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
