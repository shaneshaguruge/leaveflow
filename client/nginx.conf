server {
  listen 80;

  # Static React bundle; unknown paths fall back to the app shell so client routes survive a refresh
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # In production there is no Vite dev proxy: nginx forwards /api/... to the api service
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
