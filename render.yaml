# NOT USED. Render needs a credit card, and this project is free-only: the API and database run on Vercel + Neon
# instead (vercel.json, api/index.js, docs/deploy-vercel.md). Kept only as a record of the earlier Render plan.
databases:
  - name: leaveflow-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: leaveflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    # Migrations (schema + demo seed, idempotent) run on every start, then the API.
    dockerCommand: sh -c "node src/db/migrate.js && node src/server.js"
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leaveflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Browser → Vercel (rewrite) → Render's proxy → API: two proxy hops, so the login rate limit sees real IPs.
      - key: TRUST_PROXY
        value: "2"
